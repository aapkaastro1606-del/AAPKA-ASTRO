name: Release Safety CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Lint, Typecheck, Test, Build & Smoke Verification
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: https://www.aapkaastro.com
      # Staging & CI Safety Isolation
      IS_STAGING_ENVIRONMENT: "true"
      ALLOW_STAGING_SCRIPTS: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_5EgPLdDr7kFj@ep-summer-grass-b4twg911-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://neondb_owner:npg_5EgPLdDr7kFj@ep-summer-grass-b4twg911.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require' }}
      REDIS_URL: "redis://localhost:6379"
      # Dummy auth credentials
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dummy_ci_key_profound_cicada"
      CLERK_SECRET_KEY: "sk_test_dummy_ci_secret_key"
      CLERK_WEBHOOK_SECRET: "whsec_dummy_ci_webhook_secret_key"
      OWNER_EMAIL: "aapkaastro1606@gmail.com"
      NEXT_PUBLIC_OWNER_EMAIL: "aapkaastro1606@gmail.com"
      # Payment, calling, storage & cron
      PAYMENT_PROVIDER: "upi"
      CALL_PROVIDER: "mock"
      STORAGE_PROVIDER: "mock"
      CRON_SECRET: "dummy_ci_cron_secret_token"
      # AI assistant dummy configuration
      CHATBOT_PROVIDER: "mock"
      CHATBOT_MODEL: "gemini-2.0-flash"
      CHATBOT_API_KEY: "dummy_mock_api_key_ci"
      CHATBOT_ENABLE_FALLBACK: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Create Test Environment
        run: |
          cat << 'EOF' > .env.test
          DATABASE_URL="${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_5EgPLdDr7kFj@ep-summer-grass-b4twg911-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require' }}"
          DIRECT_URL="${{ secrets.DIRECT_URL || 'postgresql://neondb_owner:npg_5EgPLdDr7kFj@ep-summer-grass-b4twg911.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require' }}"
          IS_STAGING_ENVIRONMENT="true"
          ALLOW_STAGING_SCRIPTS="true"
          OWNER_EMAIL="aapkaastro1606@gmail.com"
          NEXT_PUBLIC_SITE_URL="http://localhost:3000"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_placeholder"
          CLERK_SECRET_KEY="sk_test_placeholder"
          CLERK_WEBHOOK_SECRET="whsec_placeholder_test_secret"
          CRON_SECRET="dummy_ci_cron_secret_token"
          CHATBOT_PROVIDER="mock"
          CHATBOT_MODEL="gemini-2.0-flash"
          CHATBOT_API_KEY="dummy_key"
          CHATBOT_ENABLE_FALLBACK="true"
          EOF

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Full Release Safety Verification
        run: npm run verify
